# Backup diário do banco de PRODUÇÃO (Supabase) — independente dos backups do
# próprio Supabase. Gera um dump completo (pg_dump, formato custom), criptografa
# com GPG (AES-256) e guarda como artefato do GitHub por 30 dias.
#
# Segredos necessários (GitHub > Settings > Secrets and variables > Actions):
#   PROD_DIRECT_URL     conexão de sessão (porta 5432) do banco de produção
#   BACKUP_PASSPHRASE   senha da criptografia — guarde-a: sem ela o backup não abre
#
# Restaurar: baixe o artefato, depois
#   gpg --decrypt tribuss-AAAA-MM-DD.dump.gpg > tribuss.dump
#   pg_restore --no-owner --no-privileges -d "<conexão do banco destino>" tribuss.dump
name: Backup do banco

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gerar dump criptografado
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_DIRECT_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Configure os segredos PROD_DIRECT_URL e BACKUP_PASSPHRASE."
            exit 1
          fi
          FILE="tribuss-$(date -u +%Y-%m-%d).dump"
          # Cliente pg_dump 17 (compatível com servidores Postgres 15 e 17 do Supabase).
          docker run --rm -e PROD_DIRECT_URL -v "$PWD:/out" postgres:17 \
            sh -c 'pg_dump "$PROD_DIRECT_URL" --format=custom --no-owner --no-privileges --file="/out/'"$FILE"'"'
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "$FILE.gpg" "$FILE"
          rm -f "$FILE"
          ls -lh "$FILE.gpg"
          echo "BACKUP_FILE=$FILE.gpg" >> "$GITHUB_ENV"

      - name: Guardar backup (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
